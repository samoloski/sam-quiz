<!DOCTYPE html>
<html lang="fr" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#4f46e5">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="sam quiz">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>sam quiz</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/subject.css">
  <link rel="stylesheet" href="css/editor.css">
  <link rel="stylesheet" href="css/quiz.css">
  <link rel="stylesheet" href="css/levels.css">
  <link rel="stylesheet" href="css/ranking.css">
  <link rel="stylesheet" href="css/daily.css">
  <link rel="stylesheet" href="css/hub.css">
  <link rel="stylesheet" href="css/install.css">
  <link rel="stylesheet" href="css/stats.css">
  <link rel="stylesheet" href="css/polish.css">
  <link rel="stylesheet" href="css/chat.css">
  <link rel="stylesheet" href="css/rankhub.css">
  <link rel="stylesheet" href="css/design.css">
  <link rel="stylesheet" href="css/home.css">
  <link rel="stylesheet" href="css/nav.css">
  <link rel="stylesheet" href="css/pro.css">
  <link rel="stylesheet" href="css/infini.css">
  <link rel="stylesheet" href="css/matieres.css">
  <link rel="stylesheet" href="css/dyn.css">
  <link rel="stylesheet" href="css/badges.css">
  <link rel="stylesheet" href="css/welcome.css">
  <link rel="stylesheet" href="css/dark.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap">
  <script>try{var t=localStorage.getItem("samquiz:theme");if(!t){t=window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
</head>
<body>

  <header id="topbar">
    <button class="back-btn" id="btn-back" type="button" aria-label="Retour">←</button>
    <h1>sam quiz</h1>
  </header>

  <main id="app">
    <section id="screen-home">
      <div id="home-list">
        <p class="empty">
          Aucune matière pour l'instant.<br>
          Appuie sur « + Matière » pour commencer.
        </p>
      </div>
    </section>

    <section id="screen-subject" hidden></section>
  </main>

  <button class="fab" id="btn-add-subject" type="button">+ Matière</button>

  <div class="toast" id="toast" hidden></div>

  <div class="modal" id="modal-subject" hidden>
    <div class="modal-box">
      <h2>Nouvelle matière</h2>
      <label class="field">
        <span>Nom de la matière</span>
        <input type="text" id="input-subject-name" placeholder="Ex : Mathématiques" autocomplete="off">
      </label>
      <label class="field">
        <span>Catégorie</span>
        <input type="text" id="input-subject-category" list="category-list" placeholder="Ex : Sciences" autocomplete="off">
        <datalist id="category-list"></datalist>
      </label>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="btn-cancel-subject" type="button">Annuler</button>
        <button class="btn btn-primary" id="btn-save-subject" type="button">Ajouter</button>
      </div>
    </div>
  </div>

  <script src="js/storage.js" charset="utf-8"></script>
  <script src="js/home.js" charset="utf-8"></script>
  <script src="js/editor.js" charset="utf-8"></script>
  <script src="data/loader.js" charset="utf-8"></script>
  <script src="js/progress.js" charset="utf-8"></script>
  <script src="js/levels.js" charset="utf-8"></script>
  <script src="js/quiz.js" charset="utf-8"></script>
  <script src="js/config.js" charset="utf-8"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/cloud.js" charset="utf-8"></script>
  <script src="js/ranking.js" charset="utf-8"></script>
  <script src="js/daily.js" charset="utf-8"></script>
  <script src="js/hub.js" charset="utf-8"></script>
  <script src="js/stats.js" charset="utf-8"></script>
  <script src="js/lbpreview.js" charset="utf-8"></script>
  <script src="js/chatui.js" charset="utf-8"></script>
  <script src="js/install.js" charset="utf-8"></script>
  <script src="js/polish.js" charset="utf-8"></script>
  <script src="js/app.js" charset="utf-8"></script>
  <script src="js/infini.js" charset="utf-8"></script>
  <script src="js/dyn.js" charset="utf-8"></script>
  <script src="js/badges.js" charset="utf-8"></script>
  <script src="js/welcome.js" charset="utf-8"></script>
  <script src="js/theme.js" charset="utf-8"></script>
  <script src="js/nav.js" charset="utf-8"></script>
</body>
</html>
